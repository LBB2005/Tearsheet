# Continuous integration (design item 52): the engine's lint, offline tests with the coverage
# bar, and replay of the stored test runs; the app's typecheck, tests with their coverage floor,
# and generated protocol types.
name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . ../scripts && uv run ruff format --check . ../scripts
      - name: Offline tests, with the coverage bar on the number-making modules
        run: uv run pytest --cov --cov-report=term
      - name: Replay the stored test runs (identical numbers)
        run: uv run tearsheet-engine --data-dir tests/fixtures/runs replay --all

  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        working-directory: app
        run: npm ci
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Tests, with the coverage floor (app/vitest.config.ts)
        working-directory: app
        run: npm run coverage
      - name: Generated protocol types are up to date (item 46)
        run: |
          (cd engine && uv sync --locked)
          (cd app && npm run gen-types)
          git diff --exit-code app/src/shared/protocol.ts
      - name: Build
        working-directory: app
        run: npm run build
