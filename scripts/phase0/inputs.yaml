# Draft link-search prompt (item 7). Code fills {company}, {ticker}, {start}, {end} and
# {sites}. Only the links in the answer are used, never its wording.
link_search_prompt: |
  Find recent news coverage and commentary about {company} (ticker {ticker}) published
  between {start} and {end}. Use web search. Look on these sites: {sites}.
  Return up to 20 links to individual articles, newest first: news stories, analysis,
  interviews and commentary from banks or fund managers. Leave out home pages, topic or
  tag pages, video pages, stock-quote pages and press-release lists. For each link give
  its full address, the article's title and the publisher, as the page shows them.

# Draft extraction prompt (step 10). One call per filing section.
extraction_prompt: |
  You are reading one section of {company}'s {form} filing with SEC: {section}.
  Pull out the evidence a research report on the company would need: the main risks,
  the drivers of its results, management's guidance and outlook, its competition,
  industry trends it describes, and notable events. Write each item as one plain
  statement in your own words, and cite the IDs of the source paragraphs that support it.
  Rules:
  - Use only the source paragraphs. Do not add outside knowledge.
  - Do not write any numbers, amounts or percentages; describe direction and size in
    words ("rose", "a large share") instead. Code supplies every number later.
  - Return at most 12 items, the most important first. If the section has nothing useful,
    return an empty list.

# Draft narration prompt (step 11), used once per company by the usage script for a
# narration-sized call on section 4.
narration_prompt: |
  Write section 4 of a research report on {company}: "Business and competitive position".
  Use only the evidence items and the source paragraphs given. Write 5 to 8 sentences in
  plain language. Each sentence cites the IDs of the paragraphs that support it, and is
  labelled positive, negative or neutral about the stock. Do not write any digits or
  number words. Do not give advice or a rating. Set "section" to "business".
