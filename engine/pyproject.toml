[project]
name = "tearsheet-engine"
dynamic = ["version"]
description = "Tearsheet's engine: code makes every number, and your own AI tool writes the cited narrative."
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Liam Blackshaw-Brown" }]
dependencies = [
    "edgartools>=4.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "exchange_calendars>=4.5",
    "claude-agent-sdk>=0.1",
    "trafilatura>=2.0",
    "keyring>=25.0",
    "jinja2>=3.1",
]

[project.scripts]
tearsheet-engine = "tearsheet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tearsheet/__init__.py"
pattern = 'ENGINE_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/tearsheet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: needs the network or a signed-in AI tool; skipped unless run with -m live",
]
filterwarnings = [
    # exchange_calendars on pandas 3; not our code.
    "ignore:Series.values returning an ndarray",
]

[tool.coverage.run]
# The modules that make or check numbers (Verification Plan): CI fails under 85% across them.
source = [
    "tearsheet.normalize",
    "tearsheet.text",
    "tearsheet.metrics",
    "tearsheet.flags",
    "tearsheet.peers",
    "tearsheet.scoring",
    "tearsheet.valuation",
    "tearsheet.rating",
    "tearsheet.data.prices",
    "tearsheet.verify",
    "tearsheet.predictions",
]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# `ruff format` keeps code to the line length; long strings and comments are left alone.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["tearsheet"]
