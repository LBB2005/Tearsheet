# Public-domain FRED series for the macro part of section 8 (Technical Plan §9).
# Reference version. The 10-year yield for valuation is named in valuation.yaml.
series:
  - {id: CPIAUCSL, name: "Consumer prices (CPI)", units: index}
  - {id: UNRATE, name: "Unemployment rate", units: percent}
