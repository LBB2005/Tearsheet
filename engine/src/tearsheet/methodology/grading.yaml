# Grading rules (Technical Plan §10). Versioned on their own; the version is stored on every
# grade row, and a change grades every prediction again as new rows (old rows stay).
version: 1

# Horizons in calendar months. The end price is the last close on or before the start date
# plus that many months; a prediction is due once a close on or after that date is stored.
horizons_months: [3, 6, 12]

# Hold is a hit when the excess return over the peer group is within this band (percentage
# points) at 12 months; at 3 and 6 months the band is scaled by √(months ÷ 12).
hold_band_points:
  low: 5
  medium: 7.5
  high: 10
  very_high: 15
  extreme: 25

# The range is the 10th-90th percentile interval: coverage target 80%, about 10% in each tail.
range:
  coverage_target: 0.80
  tail_target: 0.10
  alpha: 0.20          # for the interval score

# Headline statistics use one official prediction per company per rolling 12 months.
headline_min_gap_days: 365

# Results are labelled "descriptive, not conclusive" until this many headline predictions are
# graded at 12 months.
conclusive_after: 200

# Baselines and intervals.
random_baseline_runs: 1000
bootstrap_runs: 2000
confidence: 0.95
