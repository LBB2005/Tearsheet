<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- frame-src allows tearsheet: and https: on purpose: with 'self' alone Chromium blocks a report
         link before Electron's will-frame-navigate sees it (docs/phase1-progress.md). Nothing loads:
         the main process cancels every frame navigation (index.ts, navigation.ts). The report frames
         themselves are srcdoc frames, sandboxed. A srcdoc frame keeps this policy as well as its
         own, so script-src names the one script a report page runs, by its hash (engine
         render.FRAME_SCRIPT, report/numbersWidth.ts); it allows nothing else. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-7hGBgqISTV3eKhdl4XbCBHl7RGKB0YmIVQMNh/WlMY8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-src 'self' tearsheet: https:" />
    <title>Tearsheet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
